[versions]
agp = "9.4.1"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
testRunner = "1.7.0"
testRules = "1.7.0"
commonsCompress = "1.27.1"
orgJson = "20240303"
ktlint = "1.8.0"
detekt = "1.23.8"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "testRules" }
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
ktlint-cli = { group = "com.pinterest.ktlint", name = "ktlint-cli", version.ref = "ktlint" }
detekt-cli = { group = "io.gitlab.arturbosch.detekt", name = "detekt-cli", version.ref = "detekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
